<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8"> <!-- Evita que los acentos y la ñ se vean corruptos -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- para que el diseño adaptable funcione en teléfonos -->
    <title>Catálogo de iniciativas — Innovation Hub</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="../css/estilos.css">

</head>

<body>
    <!-- Encabezado -->
    <header>
        <!-- navbar-expand-lg: indica que a partir de pantallas grandes (lg) 
         el menú se muestra expandido -->
        <nav class="navbar navbar-expand-lg">

            <!--container: centra el contenido y hace que tenga márgenes/espacios 
            adecuados según el tamaño de la pantalla -->
            <div class="container">

                <!-- Nombre del sistema -->
                <a class="navbar-brand" href="../index.html">
                    Innovation Hub
                </a>


                <!-- Botón para dispositivos pequeños -->
                <!-- 
                class="navbar-toggler": indica que este botón es el encargado de abrir/cerrar el menú del navbar cuando está colapsado.
                data-bs-toggle="collapse": Cuando presionen este botón, quiero mostrar u ocultar algo.
                data-bs-target: qué elemento debe mostrar u ocultar. El # significa que estamos buscando un id
                aria-controls: Accesibilidad. Indica que este botón controla el elemento llamado menuPrincipal
                aria-expanded: Accesibilidad. Indica si el menú está abierto o cerrado
                -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal" aria-expanded="false" aria-label="Mostrar navegación">
                    <!-- class="navbar-toggler-icon": Coloca el ícono típico de menú de tres líneas -->
                    <span class="navbar-toggler-icon"></span>
                </button>


                <!-- Navegación principal -->
                <!-- 
                collapse: permite que ese contenido se pueda mostrar y ocultar.
                navbar-collapse: le indica a Bootstrap que ese contenido que se está colapsando pertenece al navbar
                -->
                <div class="collapse navbar-collapse" id="menuPrincipal">

                    <!-- 
                    navbar-nav: Acomoda y da formato apropiado a esos elementos dentro de la barra de navegación
                    margin-start: auto: empujar las opciones hacia el final o la derecha
                    -->
                    <ul class="navbar-nav ms-auto">

                        <!--nav-link active: Le indica a Bootstrap que este es un enlace en el nav y active le esta diciando que esta 
                        opcion pertenece a la pagina en la que estamos -->
                        <li class="nav-item">
                            <a class="nav-link" href="../index.html">
                                Inicio
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active" href="paginas/catalogo.html" aria-current="page">
                                Iniciativas
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="paginas/publicar.html">
                                Publicar
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="paginas/perfil.html">
                                Perfil
                            </a>
                        </li>

                    </ul>

                </div>

            </div>

        </nav>

    </header>

    <main class="container py-4">

    <!--
    container: centra el contenido y deja espacios laterales adecuados
    dependiendo del tamaño de la pantalla.
    
    py-4: agrega espacio interno (padding) arriba y abajo.
    p = padding
    y = eje vertical (arriba y abajo)
    4 = cantidad de espacio que agrega Bootstrap
    -->


        <!-- Título de la página -->
        <!--
        mb-4: agrega un margen debajo de esta sección.
        m = margin
        b = bottom (abajo)
        4 = cantidad de espacio
        -->
        <section class="mb-4">

            <h1>Catálogo de iniciativas</h1>

            <p>
                Explora las iniciativas disponibles y encuentra
                oportunidades para colaborar.
            </p>

        </section>


        <!-- Búsqueda y filtros -->
        <!--
        mb-5: agrega un margen debajo del aside para separarlo
        de la sección de resultados.
        -->
        <aside aria-labelledby="titulo-filtros" class="mb-5">

            <!--
            mb-3: agrega un margen debajo del título.
            -->
            <h2 id="titulo-filtros" class="mb-3">
                Buscar y filtrar iniciativas
            </h2>

            <form>

                <!--
                row: crea una fila utilizando el sistema Grid de Bootstrap.

                g-3: agrega separación entre los elementos que se encuentran
                dentro de la fila.
                g = gap (espacio)
                3 = cantidad de espacio
                -->
                <div class="row g-3">


                    <!-- Búsqueda -->
                    <!--
                    col-12: hace que este elemento ocupe las 12 columnas
                    disponibles, es decir, todo el ancho.
                    -->
                    <div class="col-12">

                        <!--
                        form-label: aplica el formato de Bootstrap
                        para las etiquetas de los formularios.
                        -->
                        <label for="busqueda" class="form-label">
                            Buscar iniciativa
                        </label>

                        <!--
                        form-control: aplica el formato de Bootstrap
                        a campos como input y textarea.
                        -->
                        <input type="search" class="form-control" id="busqueda" name="busqueda"
                            placeholder="Buscar por título o palabra clave">

                    </div>


                    <!-- Tipo -->
                    <!--
                    col-12: en pantallas pequeñas ocupa las 12 columnas,
                    por lo tanto utiliza todo el ancho.

                    col-md-4: a partir de pantallas medianas (md),
                    ocupa 4 de las 12 columnas disponibles.

                    Como tenemos tres filtros de 4 columnas:
                    4 + 4 + 4 = 12.
                    Por eso pueden aparecer uno al lado del otro.
                    -->
                    <div class="col-12 col-md-4">

                        <label for="filtro-tipo" class="form-label">
                            Tipo
                        </label>

                        <!--
                        form-select: aplica el formato de Bootstrap
                        a una lista desplegable (select).
                        -->
                        <select class="form-select" id="filtro-tipo" name="tipo">
                            <option value="">Todos</option>
                            <option value="idea">Idea</option>
                            <option value="necesidad">Necesidad</option>
                            <option value="reto">Reto</option>
                        </select>

                    </div>


                    <!-- Categoría -->
                    <!--
                    col-12 col-md-4: ocupa todo el ancho en pantallas pequeñas
                    y 4 columnas a partir de pantallas medianas.
                    -->
                    <div class="col-12 col-md-4">

                        <label for="filtro-categoria" class="form-label">
                            Categoría
                        </label>

                        <!--
                        form-select: aplica los estilos de Bootstrap
                        al select.
                        -->
                        <select class="form-select" id="filtro-categoria" name="categoria">
                            <option value="">Todas</option>
                            <option value="tecnologia">Tecnología</option>
                            <option value="educacion">Educación</option>
                            <option value="sostenibilidad">Sostenibilidad</option>
                            <option value="impacto-social">Impacto social</option>

                            <option value="negocios-emprendimiento">
                                Negocios y emprendimiento
                            </option>

                            <option value="salud-bienestar">
                                Salud y bienestar
                            </option>

                            <option value="cultura-creatividad">
                                Cultura y creatividad
                            </option>

                            <option value="otro">Otro</option>
                        </select>

                    </div>


                    <!-- Competencia -->
                    <!--
                    col-12 col-md-4: en celular ocupa todo el ancho
                    y desde md ocupa 4 de las 12 columnas.
                    -->
                    <div class="col-12 col-md-4">

                        <label for="filtro-competencia" class="form-label">
                            Competencia requerida
                        </label>

                        <!--
                        form-control: aplica el estilo de Bootstrap
                        al campo de texto.
                        -->
                        <input type="text" class="form-control" id="filtro-competencia" name="competencia"
                            placeholder="Ej. JavaScript">

                    </div>


                    <!-- Botón -->
                    <div class="col-12">

                        <!--
                        btn: aplica el formato básico de botón de Bootstrap.

                        btn-primary: indica que este es un botón principal.
                        Por ahora utiliza el color predeterminado de Bootstrap,
                        pero después cambiaremos ese color con nuestro CSS
                        para utilizar la paleta de Innovation Hub.
                        -->
                        <button type="submit" class="btn btn-primary">
                            Aplicar filtros
                        </button>

                    </div>

                </div>

            </form>

        </aside>


        <!-- Resultados -->
        <section aria-labelledby="titulo-resultados">

            <!--
            mb-4: agrega margen debajo del título para separarlo
            de las tarjetas de iniciativas.
            -->
            <h2 id="titulo-resultados" class="mb-4">
                Iniciativas
            </h2>


            <!--
            row: crea una fila del Grid de Bootstrap.

            g-4: agrega separación entre las tarjetas que JavaScript
            colocará dentro de esta fila.
            -->
            <div id="lista-iniciativas" class="row g-4">
                <!-- Las iniciativas se cargarán con JavaScript -->
            </div>

        </section>

    </main>

    <footer>
        <p>Innovation Hub · Universidad CENFOTEC</p>
    </footer>

    <!-- JavaScript de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
